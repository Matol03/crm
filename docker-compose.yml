# Continuous poller + (optional) read-only ops view.
#
# Secrets come from a .env file that stays on the host and is never committed
# or baked into the image. Both services share the same SQLite volume because
# the ops view reads the poller's database.

services:
  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/prod.sqlite
    volumes:
      - lead-data:/app/data

  # Optional: the Should-tier read-only lead view + resend action.
  # Remove this block if you do not want it reachable.
  ops:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "server/src/api/server.ts"]
    env_file: .env
    environment:
      DB_PATH: /app/data/prod.sqlite
    volumes:
      - lead-data:/app/data
    ports:
      # Bound to localhost only — the page is gated by a shared secret, not a
      # real auth system, so do not expose it to the internet as-is.
      - "127.0.0.1:4318:4318"

volumes:
  lead-data:
